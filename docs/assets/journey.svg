<rect class="node" x="692" y="44" width="116" height="104" rx="14"/>
<text class="sans num" x="706" y="68" font-size="12">05</text>
<text class="sans title" x="706" y="94" font-size="18">Ship</text>
<text class="sans prom" x="706" y="116" font-size="12.5">domain · host ·</text>
<text class="sans prom" x="706" y="132" font-size="12.5">payments</text>
<line class="arrow" x1="808" y1="96.0" x2="826" y2="96.0" marker-end="url(#ah)"/>
<line class="feed" x1="750.0" y1="184" x2="750.0" y2="148"/>
<rect class="node" x="828" y="44" width="116" height="104" rx="14"/>
<text class="sans num" x="842" y="68" font-size="12">06</text>
<text class="sans title" x="842" y="94" font-size="18">Infra</text>
<text class="sans prom" x="842" y="116" font-size="12.5">Terraform ·</text>
<text class="sans prom" x="842" y="132" font-size="12.5">Fargate</text>
<line class="feed" x1="886.0" y1="184" x2="886.0" y2="148"/>
<rect class="bar" x="16" y="184" width="928" height="48" rx="12"/>
<text class="mono bartx" x="34" y="214" font-size="16">.hyperui/</text>
<text class="sans barsub" x="140" y="213" font-size="13">per-project memory: profile · decisions · spec — read and updated by every stage</text>
